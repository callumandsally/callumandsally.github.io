{{ define "main" }}
<div class="post-grid">
  {{ range first 12 (where site.RegularPages "Section" "posts") }}
  <article class="post-card">
    <div class="post-card-image" {{ with .Params.image }}style="background-image: url('{{ . }}');"{{ end }}>
      <div class="post-card-overlay">
        {{ with .Params.categories }}
          {{ range . }}
            <span class="post-card-category">{{ i18n . | default . }}</span>
          {{ end }}
        {{ end }}
        <h2 class="post-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <time class="post-card-date">{{ .Date.Format "2 January 2006" }}</time>
      </div>
    </div>
  </article>
  {{ end }}
</div>
{{ end }}
