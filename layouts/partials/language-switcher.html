{{/*
  言語切り替えボタン
  Windows 10は国旗絵文字非対応のため、テキストで表記
*/}}

{{ if gt (len site.Languages) 1 }}
<nav class="language-switcher" aria-label="{{ i18n "switch_language" }}">
  {{ if .IsTranslated }}
    {{ range .Translations }}
      <a href="{{ .RelPermalink }}" class="lang-switch-btn"
         title="{{ if eq .Language.Lang "ja" }}日本語{{ else }}English{{ end }}">
        {{ if eq .Language.Lang "ja" }}JP{{ else }}EN{{ end }}
      </a>
    {{ end }}
  {{ else }}
    {{ if eq .Language.Lang "ja" }}
      <a href="/en/" class="lang-switch-btn" title="English">EN</a>
    {{ else }}
      <a href="/" class="lang-switch-btn" title="日本語">JP</a>
    {{ end }}
  {{ end }}
</nav>
{{ end }}
