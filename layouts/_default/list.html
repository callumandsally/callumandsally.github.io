{{ define "main" }}
<section class="post-list">
  <h1>{{ .Title }}</h1>

  {{ range .Pages }}
  <article class="post-card">
    {{ with .Params.image }}
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy" style="width:100%; height:auto; border-radius:6px;">
    {{ end }}
    <div class="post-card-content">
      {{ with .Params.categories }}
        {{ range . }}
          <span class="category-label" style="display:block; font-size:0.75em; text-transform:uppercase; letter-spacing:0.1em; opacity:0.85; margin-bottom:0.3em;">{{ i18n . | default . }}</span>
        {{ end }}
      {{ end }}
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "2 January 2006" }}
      </time>
    </div>
  </article>
  {{ end }}
</section>
{{ end }}
