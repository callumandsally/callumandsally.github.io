<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callum &amp; Sally – Under Maintenance</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://callumandsally.littlestar.jp/wordpress/wp-content/uploads/2025/07/maintenance-background-overlay.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Georgia', serif;
      color: #ffffff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2em 1em;
      box-sizing: border-box;
    }

    .container {
      max-width: 640px;
    }

    h1 {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 0.5em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .italic {
      font-style: italic;
      font-size: 1.8em;
      margin-top: 2em;
    }

    .signature {
      font-size: 1.6em;
      font-weight: bold;
      margin-top: 0.5em;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8em; }
      .italic { font-size: 1.3em; }
      .signature { font-size: 1.2em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>We're working behind the scenes…</h1>
    <p>
      Just like a pot of tea needs time to steep,<br>
      our site needs a moment to bloom.
    </p>
    <p>
      We'll be back very soon—with more stories,<br>
      more warmth, and more love.
    </p>
    <p>Thank you for waiting.</p>
    <p class="italic">With love,</p>
    <p class="signature">Callum &amp; Sally</p>
  </div>
</body>
</html>
